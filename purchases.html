<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سوبر ماركت أبو سارة — المشتريات والتوريد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Almarai:wght@400;700&display=swap" rel="stylesheet">

<!-- Supabase & Camera Scanner -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
  :root{
    --ink:#1C2B33;
    --ink-soft:#3C4C54;
    --paper:#F7F5F0;
    --card:#FFFFFF;
    --brass:#B8862E;
    --brass-deep:#8F6A22;
    --sage:#4F7A63;
    --sage-bg:#EAF1EC;
    --clay:#B23B3B;
    --clay-bg:#F7E9E7;
    --warn:#C87D12;
    --warn-bg:#FDF6E9;
    --line:#E4DED0;
    --line-soft:#EFEBE0;
    --sidebar-w: 58px;
    --radius: 10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Almarai', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  h1,h2,h3,h4,.display{font-family:'Tajawal',sans-serif;}
  .tabular{font-variant-numeric: tabular-nums;}
  a{text-decoration:none;color:inherit;}

  .app-container{
    display:flex;
    width:100%;
    max-width:600px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    border-inline:1px solid var(--line-soft);
  }

  /* 1. الشريط الجانبي */
  .sidebar{
    width:var(--sidebar-w);
    background:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0;
    gap:4px;
    flex-shrink:0;
    position:sticky;
    top:0;
    height:100vh;
    z-index:20;
  }
  .sidebar-logo{
    width:38px;height:38px;background:var(--brass);border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Tajawal';font-weight:800;font-size:17px;color:var(--ink);
    margin-bottom:6px;
  }
  .side-link{
    width:44px;height:44px;border-radius:8px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#9AABB4;gap:2px;transition:0.15s;
  }
  .side-link .icon{font-size:16px;}
  .side-link .lbl{font-size:7.5px;font-weight:700;}
  .side-link:hover, .side-link.active{background:rgba(255,255,255,0.12);color:#fff;}
  .side-link.active{background:var(--brass);color:var(--ink);}

  /* 2. منطقة العمل */
  .main-content{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    padding-bottom:20px;
  }

  .purchases-header{padding:12px 14px;background:var(--ink);color:#fff;border-radius:0 0 14px 14px;}
  .header-meta{display:flex;align-items:center;justify-content:space-between;}
  .store-title{font-family:'Tajawal';font-weight:800;font-size:15px;}
  .header-tag{font-size:10.5px;color:#D9CBA8;}

  .search-wrap{display:flex;gap:6px;margin-top:10px;}
  .search-box{
    flex:1;background:rgba(255,255,255,.12);border-radius:9px;display:flex;align-items:center;gap:6px;padding:8px 10px;
  }
  .search-box input{background:transparent;border:none;outline:none;color:#fff;font-family:'Almarai';font-size:12.5px;flex:1;}
  .search-box input::placeholder{color:#B9C1C4;}
  .scan-btn{
    width:36px;height:36px;background:var(--brass);border-radius:9px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:15px;
  }

  /* بيانات المورد والفاتورة */
  .supplier-box{
    margin:8px 10px 0;padding:8px 10px;background:var(--card);border:1px solid var(--line-soft);
    border-radius:8px;display:flex;gap:6px;flex-direction:column;
  }
  .s-row{display:flex;gap:6px;}
  .s-field{flex:1;display:flex;flex-direction:column;gap:2px;}
  .s-field label{font-size:10px;font-weight:700;color:var(--ink-soft);}
  .s-field input{
    height:30px;padding:0 8px;border-radius:6px;border:1px solid var(--line);
    font-family:'Almarai';font-size:11.5px;outline:none;background:#fff;
  }
  .s-field input:focus{border-color:var(--brass);}

  /* بنود فاتورة الشراء */
  .items-section{padding:8px 10px 4px;flex:1;}
  .empty-items{
    padding:26px 10px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty-items .icon{font-size:22px;color:#C9C2B2;margin-bottom:4px;}
  .empty-items p{margin:0;font-size:11.5px;color:#A39C8D;}

  .item-card{
    background:var(--card);border:1px solid var(--line-soft);border-radius:10px;
    padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px;
  }
  .item-top{display:flex;justify-content:space-between;align-items:center;}
  .item-name{font-size:12.5px;font-weight:800;color:var(--ink);font-family:'Tajawal';}
  .item-del{border:none;background:transparent;color:#A39C8D;font-size:14px;cursor:pointer;padding:2px 4px;}
  .item-del:hover{color:var(--clay);}

  .item-grid{
    display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:6px;align-items:center;
  }
  .ig-cell{display:flex;flex-direction:column;gap:2px;}
  .ig-cell label{font-size:9.5px;font-weight:700;color:var(--ink-soft);}
  .ig-cell input, .ig-cell select{
    height:28px;padding:0 6px;border-radius:6px;border:1px solid var(--line);
    font-family:'Almarai';font-size:11.5px;outline:none;background:var(--paper);
  }

  /* شريط التنبيه الذكي لارتفاع سعر الشراء وتحديث البيع */
  .price-alert-box{
    background:var(--warn-bg);border:1px solid #E9D2A8;border-radius:8px;
    padding:7px 8px;display:flex;flex-direction:column;gap:6px;
  }
  .pab-header{
    display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--warn);font-family:'Tajawal';
  }
  .pab-inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .pab-field{display:flex;flex-direction:column;gap:2px;}
  .pab-field label{font-size:9.5px;font-weight:700;color:var(--brass-deep);}
  .pab-field input{
    height:26px;padding:0 6px;border-radius:5px;border:1px solid #DFBE82;background:#fff;
    font-family:'Almarai';font-size:11px;font-weight:700;color:var(--ink);outline:none;
  }

  .item-subtotal-row{
    display:flex;justify-content:space-between;align-items:center;
    padding-top:4px;border-top:1px dashed var(--line-soft);font-size:11px;
  }
  .item-subtotal-val{font-family:'Tajawal';font-weight:800;font-size:13px;color:var(--ink);}

  /* ملخص الدفع وحسابات الصندوق */
  .pay-summary{padding:6px 10px 0;background:var(--paper);}
  .sum-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);padding:2px 0;}
  .sum-row.total{
    font-family:'Tajawal';font-weight:800;font-size:14.5px;color:var(--ink);
    border-top:1px dashed var(--line);margin-top:4px;padding-top:5px;
  }

  .pay-methods{display:flex;gap:5px;padding:6px 10px 0;}
  .pm-btn{
    flex:1;padding:6px 2px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .pm-btn.active{border-color:var(--brass);background:#FBF3E6;color:var(--brass-deep);}

  .paid-amount-wrap{
    margin:6px 10px 0;padding:8px;background:var(--card);border:1px solid var(--line-soft);
    border-radius:8px;display:flex;align-items:center;gap:6px;
  }
  .paid-amount-wrap input{
    flex:1;height:30px;padding:0 8px;border-radius:6px;border:1px solid var(--line);
    font-size:12px;font-weight:700;outline:none;
  }

  .checkout-bar{
    position:sticky;bottom:0;padding:6px 10px 8px;background:var(--paper);z-index:10;
  }
  .submit-btn{
    width:100%;border:none;border-radius:8px;padding:12px;font-family:'Tajawal';font-weight:800;font-size:13.5px;
    background:var(--sage);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .submit-btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* نافذة الكاميرا */
  .modal-overlay{
    display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);
    z-index:100;align-items:center;justify-content:center;padding:12px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    width:100%;max-width:340px;background:#fff;border-radius:12px;overflow:hidden;
    padding:10px;position:relative;
  }
  .modal-close{
    position:absolute;top:8px;left:8px;background:transparent;border:none;
    font-size:16px;cursor:pointer;color:#888;z-index:10;
  }
</style>
</head>
<body>

<div class="app-container">

  <!-- 1. الشريط الجانبي -->
  <aside class="sidebar">
    <div class="sidebar-logo">س</div>
    <a href="index.html" class="side-link" title="البيع"><span class="icon">🛒</span><span class="lbl">البيع</span></a>
    <a href="products.html" class="side-link" title="المخزون"><span class="icon">📦</span><span class="lbl">المخزون</span></a>
    <a href="statement.html" class="side-link" title="العملاء"><span class="icon">👥</span><span class="lbl">العملاء</span></a>
    <a href="purchases.html" class="side-link active" title="المشتريات"><span class="icon">🧾</span><span class="lbl">المشتريات</span></a>
    <a href="transfer.html" class="side-link" title="التحويل"><span class="icon">🏬</span><span class="lbl">التحويل</span></a>
    <a href="cashbox.html" class="side-link" title="الصندوق"><span class="icon">💰</span><span class="lbl">الصندوق</span></a>
    <a href="reports.html" class="side-link" title="التقارير"><span class="icon">📊</span><span class="lbl">التقارير</span></a>
    <a href="settings.html" class="side-link" title="الإعدادات"><span class="icon">⚙️</span><span class="lbl">الإعدادات</span></a>
  </aside>

  <!-- 2. مساحة العمل -->
  <main class="main-content">
    
    <div class="purchases-header">
      <div class="header-meta">
        <div class="store-title">فاتورة توريد ومشتريات جديدة</div>
        <div class="header-tag">المستودع الرئيسي</div>
      </div>

      <div class="search-wrap">
        <div class="search-box">
          🔍<input type="text" id="barcodeInput" placeholder="امسح باركود الصنف الوارد...">
        </div>
        <div class="scan-btn" onclick="startCameraScanner()" title="كاميرا الموبايل">📷</div>

    <!-- بيانات المورد والفاتورة -->
    <div class="supplier-box">
      <div class="s-row">
        <div class="s-field">
          <label>اسم المورد / الشركة</label>
          <input type="text" id="supplierName" placeholder="مثال: شركة الخير للتوزيع">
        </div>
        <div class="s-field" style="max-width:110px;">
          <label>رقم الفاتورة</label>
          <input type="text" id="supplierInvNo" placeholder="INV-001">
        </div>
      </div>
    </div>

    <!-- بنود البضاعة الواردة -->
    <div class="items-section">
      <div id="purchaseItemsContainer"></div>
      <div class="empty-items" id="emptyItemsBox">
        <div class="icon">🧾</div>
        <p>لا توجد بضائع مدخلة — امسح الباركود لإضافة الأصناف</p>
      </div>
    </div>

    <!-- ملخص المبالغ وطريقة الدفع من الصندوق -->
    <div class="pay-summary">
      <div class="sum-row total"><span>إجمالي فاتورة الشراء:</span><span class="tabular" id="grandTotalDisplay">0 ل.س</span></div>
    </div>

    <div class="pay-methods" id="payMethods">
      <div class="pm-btn active" data-method="cash">💵 نقداً من الصندوق</div>
      <div class="pm-btn" data-method="wallet">📱 كاش إلكتروني</div>
      <div class="pm-btn" data-method="credit">⏳ آجل (ذمة للمورد)</div>
    </div>

    <div class="paid-amount-wrap" id="paidAmountWrap">
      <span style="font-size:11px;font-weight:700;color:var(--ink-soft);">المبلغ المدفوع فعلياً:</span>
      <input type="number" id="paidAmountInput" placeholder="المبلغ المدفوع" class="tabular" oninput="recalculateTotals()">
      <span style="font-size:11px;font-weight:700;">ل.س</span>
    </div>

    <div class="checkout-bar">
      <button class="submit-btn" id="submitPurchaseBtn" disabled onclick="submitPurchaseInvoice()">
        ✔ اعتماد الفاتورة وتحديث الأسعار والمخزون
      </button>

  </main>
</div>

<div class="modal-overlay" id="scannerModal">
  <div class="modal-card">
    <button class="modal-close" onclick="stopCameraScanner()">✕</button>
    <div id="reader" style="width:100%;"></div>
  </div>
</div>

<script>
/* ========================================================
   1. الاتصال بـ Supabase
   ======================================================== */
const SUPABASE_URL = 'https://gadcgzgxwwvmowqktyfu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhZGNnemd4d3d2bW93cWt0eWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NTU3NjgsImV4cCI6MjEwMjQzMTc2OH0.eSIBKuQADnmHxqrHHqQR_EtsC18cTp_6bwYjqxp6H9g';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const MAIN_BRANCH_ID = 'b1111111-1111-1111-1111-111111111111';

let catalog = [];
let purchaseItems = [];
let payMethod = 'cash';
let html5QrCode = null;

function focusBarcode(){
  setTimeout(() => {
    const el = document.getElementById('barcodeInput');
    if(el) el.focus();
  }, 100);
}

/* ========================================================
   2. جلب كتالوج الأصناف المسبق
   ======================================================== */
async function loadCatalog(){
  try{
    const { data, error } = await db.from('products').select('*');
    if(error) throw error;
    catalog = data || [];
  }catch(e){
    console.error('Error loading catalog:', e);
  }
}

/* ========================================================
   3. إضافة بنود الشراء ومعالجة ارتفاع الأسعار
   ======================================================== */
function handleBarcodeScan(code){
  const clean = code.trim();
  const prod = catalog.find(p => p.barcode === clean);

  if(!prod){
    alert('الصنف غير مسجل بالباركود: ' + clean + ' — يرجى إضافته أولاً من شاشة المخزون');
    focusBarcode();
    return;
  }

  const existing = purchaseItems.find(i => i.productId === prod.id && i.selectedUnitIdx === 0);
  if(existing){
    existing.qty += 1;
  } else {
    const units = prod.units || [
      { name: prod.unit_name || 'قطعة', multiplier: 1, retail: prod.retail_price || 0, wholesale: prod.wholesale_price || 0 }
    ];
    if(prod.packaging_name && prod.packaging_qty > 1 && units.length === 1){
      units.push({
        name: prod.packaging_name,
        multiplier: prod.packaging_qty,
        retail: prod.packaging_retail_price || (prod.retail_price * prod.packaging_qty),
        wholesale: prod.packaging_wholesale_price || (prod.wholesale_price * prod.packaging_qty)
      });
    }

    const oldCost = parseFloat(prod.cost_price || 0);

    purchaseItems.push({
      productId: prod.id,
      barcode: prod.barcode,
      name: prod.name,
      units: units,
      selectedUnitIdx: 0,
      qty: 1,
      costPrice: oldCost,
      oldCostPrice: oldCost,
      currentRetail: parseFloat(prod.retail_price || 0),
      newRetail: parseFloat(prod.retail_price || 0),
      currentWholesale: parseFloat(prod.wholesale_price || 0),
      newWholesale: parseFloat(prod.wholesale_price || 0)
    });
  }

  renderPurchaseItems();
  focusBarcode();
}

function updateItemCost(idx, val){
  const cost = parseFloat(val) || 0;
  const item = purchaseItems[idx];
  item.costPrice = cost;

  // إذا ارتفع سعر الشراء عن التكلفة القديمة، نقترح زيادة سعر البيع تلقائياً بنفس النسبة
  if(cost > item.oldCostPrice && item.oldCostPrice > 0){
    const ratio = cost / item.oldCostPrice;
    item.newRetail = Math.round((item.currentRetail * ratio) / 500) * 500;
    item.newWholesale = Math.round((item.currentWholesale * ratio) / 500) * 500;
  } else {
    item.newRetail = item.currentRetail;
    item.newWholesale = item.currentWholesale;
  }
  renderPurchaseItems();
}

function updateItemQty(idx, val){
  const q = parseFloat(val);
  purchaseItems[idx].qty = (isNaN(q) || q <= 0) ? 1 : q;
  renderPurchaseItems();
}

function updateItemUnit(idx, uIdx){
  purchaseItems[idx].selectedUnitIdx = parseInt(uIdx);
  renderPurchaseItems();
}

function updateNewRetail(idx, val){
  purchaseItems[idx].newRetail = parseFloat(val) || 0;
}

function updateNewWholesale(idx, val){
  purchaseItems[idx].newWholesale = parseFloat(val) || 0;
}

function deleteItem(idx){
  purchaseItems.splice(idx, 1);
  renderPurchaseItems();
  focusBarcode();
}

function renderPurchaseItems(){
  const container = document.getElementById('purchaseItemsContainer');
  const emptyBox = document.getElementById('emptyItemsBox');

  emptyBox.style.display = purchaseItems.length === 0 ? 'block' : 'none';
  container.style.display = purchaseItems.length === 0 ? 'none' : 'block';

  let grandTotal = 0;

  container.innerHTML = purchaseItems.map((item, idx) => {
    const unit = item.units[item.selectedUnitIdx];
    const totalUnitCost = item.costPrice * unit.multiplier;
    const itemSubtotal = totalUnitCost * item.qty;
    grandTotal += itemSubtotal;

    const isIncreased = item.costPrice > item.oldCostPrice;

    const unitOptions = item.units.map((u, uIdx) => 
      `<option value="${uIdx}" ${uIdx === item.selectedUnitIdx ? 'selected' : ''}>${u.name}</option>`
    ).join('');

    return `
      <div class="item-card">
        <div class="item-top">
          <div class="item-name">${item.name}</div>
          <button class="item-del" onclick="deleteItem(${idx})">✕</button>
        </div>

        <div class="item-grid">
          <div class="ig-cell">
            <label>نوع التعبئة</label>
            <select onchange="updateItemUnit(${idx}, this.value)">${unitOptions}</select>
          </div>
          <div class="ig-cell">
            <label>الكمية المستلمة</label>
            <input type="number" class="tabular" value="${item.qty}" min="1" onchange="updateItemQty(${idx}, this.value)">
          </div>
          <div class="ig-cell">
            <label>تكلفة الحبة (ل.س)</label>
            <input type="number" class="tabular" value="${item.costPrice}" onchange="updateItemCost(${idx}, this.value)">
          </div>
        </div>

        ${isIncreased ? `
          <!-- شريط تنبيه ارتفاع السعر وتحديث تسعير الرف والمخزون بالكامل -->
          <div class="price-alert-box">
            <div class="pab-header">
              ⚠️ ارتفع سعر التكلفة من (${item.oldCostPrice.toLocaleString('ar-EG')}) إلى (${item.costPrice.toLocaleString('ar-EG')}) ل.س — حدّث سعر البيع للكل:
            </div>
            <div class="pab-inputs">
              <div class="pab-field">
                <label>سعر المفرق الجديد للقطعة</label>
                <input type="number" class="tabular" value="${item.newRetail}" onchange="updateNewRetail(${idx}, this.value)">
              </div>
              <div class="pab-field">
                <label>سعر الجملة الجديد للقطعة</label>
                <input type="number" class="tabular" value="${item.newWholesale}" onchange="updateNewWholesale(${idx}, this.value)">
              </div>
            </div>
          </div>
        ` : ''}

        <div class="item-subtotal-row">
          <span>إجمالي البند:</span>
          <span class="item-subtotal-val tabular">${itemSubtotal.toLocaleString('ar-EG')} ل.س</span>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('grandTotalDisplay').innerText = `${grandTotal.toLocaleString('ar-EG')} ل.س`;
  window.currentPurchaseTotal = grandTotal;

  recalculateTotals();
}

function recalculateTotals(){
  const total = window.currentPurchaseTotal || 0;
  const paidInput = document.getElementById('paidAmountInput');
  const submitBtn = document.getElementById('submitPurchaseBtn');

  if(payMethod === 'credit'){
    paidInput.value = '0';
    paidInput.disabled = true;
  } else if(payMethod === 'cash' || payMethod === 'wallet'){
    paidInput.disabled = false;
    if(!paidInput.value || parseFloat(paidInput.value) > total){
      paidInput.value = total;
    }
  }

  submitBtn.disabled = purchaseItems.length === 0;
}

/* ========================================================
   4. اعتماد الفاتورة وترحيل المخزون والصندوق
   ======================================================== */
async function submitPurchaseInvoice(){
  const btn = document.getElementById('submitPurchaseBtn');
  btn.disabled = true;
  btn.innerText = 'جاري ترحيل البضائع وتحديث الأسعار...';

  const supplier = document.getElementById('supplierName').value.trim() || 'مورد عام';
  const invNo = document.getElementById('supplierInvNo').value.trim() || 'PO-' + Date.now().toString().slice(-6);
  const total = window.currentPurchaseTotal || 0;
  const paidAmt = parseFloat(document.getElementById('paidAmountInput').value) || 0;

  try{
    // 1. تسجيل فاتورة الشراء في جدول purchases
    const { data: purchaseData, error: pErr } = await db.from('purchases').insert([{
      branch_id: MAIN_BRANCH_ID,
      supplier_name: supplier,
      invoice_number: invNo,
      total_amount: total,
      paid_amount: paidAmt,
      payment_method: payMethod
    }]).select().single();

    // 2. تحديث كل مادة: (زيادة رصيد المستودع + اعتماد سعر البيع الجديد والتكلفة للكل)
    for(const item of purchaseItems){
      const unit = item.units[item.selectedUnitIdx];
      const addedPieces = item.qty * unit.multiplier;

      // تحديث سعر التكلفة والبيع في جدول products
      await db.from('products').update({
        cost_price: item.costPrice,
        retail_price: item.newRetail,
        wholesale_price: item.newWholesale,
        updated_at: new Date().toISOString()
      }).eq('id', item.productId);

      // زيادة كمية المخزون في inventory
      const { data: invRow } = await db.from('inventory')
        .select('quantity')
        .eq('product_id', item.productId)
        .eq('branch_id', MAIN_BRANCH_ID)
        .maybeSingle();

      const currentQty = invRow ? parseFloat(invRow.quantity) : 0;
      const newQty = currentQty + addedPieces;

      await db.from('inventory').upsert({
        product_id: item.productId,
        branch_id: MAIN_BRANCH_ID,
        quantity: newQty,
        updated_at: new Date().toISOString()
      }, { onConflict: 'product_id,branch_id' });
    }

    // 3. خصم المبلغ المدفوع من الصندوق كسند صرف إذا تم الدفع نقداً
    if(paidAmt > 0 && payMethod === 'cash'){
      await db.from('cashbox_transactions').insert([{
        branch_id: MAIN_BRANCH_ID,
        transaction_type: 'out',
        amount: paidAmt,
        payment_method: 'cash',
        reference_number: invNo,
        notes: `دفع فاتورة مشتريات للمورد: ${supplier} (#${invNo})`
      }]);
    }

    alert('✔ تم اعتماد فاتورة التوريد بنجاح، وتحديث رصيد المخزون وأسعار البيع لكافة الكميات.');

    // إعادة التهيئة
    purchaseItems = [];
    document.getElementById('supplierName').value = '';
    document.getElementById('supplierInvNo').value = '';
    document.getElementById('paidAmountInput').value = '';
    renderPurchaseItems();
    await loadCatalog();

  }catch(err){
    console.error(err);
    alert('حدث خطأ أثناء الترحيل: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = '✔ اعتماد الفاتورة وتحديث الأسعار والمخزون';
    focusBarcode();
  }
}

/* ========================================================
   5. كاميرا الباركود
   ======================================================== */
function startCameraScanner(){
  document.getElementById('scannerModal').classList.add('show');
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 230, height: 150 } },
    (decodedText) => {
      stopCameraScanner();
      handleBarcodeScan(decodedText);
    },
    () => {}
  ).catch(err => {
    alert("تعذر تشغيل الكاميرا: " + err);
    stopCameraScanner();
  });
}

function stopCameraScanner(){
  if(html5QrCode){
    html5QrCode.stop().then(() => {
      html5QrCode.clear();
      document.getElementById('scannerModal').classList.remove('show');
      focusBarcode();
    }).catch(() => {
      document.getElementById('scannerModal').classList.remove('show');
      focusBarcode();
    });
  } else {
    document.getElementById('scannerModal').classList.remove('show');
    focusBarcode();
  }
}

/* ========================================================
   6. الأحداث والتشغيل
   ======================================================== */
window.addEventListener('DOMContentLoaded', async () => {
  await loadCatalog();
  focusBarcode();
});

document.getElementById('barcodeInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    if(e.target.value){
      handleBarcodeScan(e.target.value);
      e.target.value = '';
    }
  }
});

document.querySelectorAll('#payMethods .pm-btn').forEach(b => {
  b.addEventListener('click', (e) => {
    document.querySelectorAll('#payMethods .pm-btn').forEach(el => el.classList.remove('active'));
    e.currentTarget.classList.add('active');
    payMethod = e.currentTarget.dataset.method;
    recalculateTotals();
    focusBarcode();
  });
});
</script>
